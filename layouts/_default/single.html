<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ .Title }} — NATALIQ</title>
  <meta name="description" content="{{ .Params.description }}">
  {{ with .Params.robots }}<meta name="robots" content="{{ . }}">{{ end }}
  <meta name="theme-color" content="#070b1f">
  <link rel="icon" type="image/png" sizes="32x32" href="{{ relURL "favicon-32.png" }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ relURL "css/styles.css" }}">
</head>
<body>
  <header class="site-header is-scrolled"><div class="container header-inner"><a class="brand" href="{{ relURL "" }}" aria-label="NATALIQ — на главную"><img class="brand__mark" src="{{ relURL "images/logo-mark.webp" }}" width="40" height="40" alt=""><span class="brand__name">NATALIQ</span></a></div></header>
  <main class="doc"><div class="container container--narrow"><h1>{{ .Title }}</h1>{{ .Content }}<a class="text-link" href="{{ relURL "" }}">← Вернуться на главную</a></div></main>
</body>
</html>
